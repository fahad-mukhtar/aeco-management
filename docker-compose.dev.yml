version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory_admin
      POSTGRES_PASSWORD: factory_admin
      POSTGRES_DB: factory_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  user-service:
    build:
      context: ./backend-services
      dockerfile: user-service/Dockerfile.dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - ./backend-services/user-service/.env
    ports:
      - "8001:8001"
    volumes:
      - ./backend-services/user-service/app:/app/app
    depends_on:
      - postgres

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./admin-frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8001
    depends_on:
      - user-service

  

volumes:
  postgres_data:
